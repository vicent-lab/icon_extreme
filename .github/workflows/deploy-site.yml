name: Deploy public site to Cloudflare Pages

# Runs only when the site changes, every 30 minutes (so edits made in the admin app appear on the website
# by themselves), or by hand. It never touches the staff/client app, which has its own workflow.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/deploy-site.yml']
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL || 'https://ioktaopzboaremkamwmd.supabase.co' }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || 'sb_publishable_rqNoDn6qaIfo9pRX2a26Mg_z2aNJhOl' }}
      PUBLIC_APP_URL: ${{ vars.APP_URL || 'https://icon-extreme.pages.dev' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://icon-site-bv6.pages.dev' }}
    steps:
      - name: Check Cloudflare keys are set (names only, never values)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!n}" ]; then echo "::error::$n is EMPTY (repository secrets)."; missing=1; fi
          done
          exit $missing
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build
        working-directory: site
        run: |
          npm ci
          npm run build
      - name: Create the Cloudflare Pages project if it does not exist yet
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true   # "already exists" is fine
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create icon-site --production-branch=main
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=icon-site --branch=main
      - name: Smoke test (site is up, form door rejects a bad message)
        run: |
          sleep 15
          # check it is OUR page (look for our own marker), not just any page at that address
          curl -s "$SITE_URL/" -o page.html
          grep -q 'Team &amp; client login' page.html || { echo "::error::$SITE_URL is not serving the ICON site"; exit 1; }
          echo "site: ours" 
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$PUBLIC_SUPABASE_URL/functions/v1/submit-lead" \
            -H 'Content-Type: application/json' -H "apikey: $PUBLIC_SUPABASE_ANON_KEY" -d '{"full_name":"x","email":"bad","message":"hi"}')
          echo "form (expect 400): $code"; [ "$code" = "400" ]
