name: Supabase migrations

# Runs only when database files change on main. Applies NEW files in supabase/migrations.
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # public value: variable, secret, or this default (all fine)
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || secrets.SUPABASE_PROJECT_ID || 'ioktaopzboaremkamwmd' }}
    steps:
      - name: Check keys are set (prints names only, never values)
        run: |
          missing=0
          for n in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!n}" ]; then echo "::error::$n is EMPTY. Add it in Settings > Secrets and variables > Actions (Secrets tab for the first two, Variables tab for SUPABASE_PROJECT_ID)."; missing=1; fi
          done
          exit $missing
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - run: supabase db push
