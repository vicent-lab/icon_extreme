name: Database access tests

# Builds a fresh database from the migrations and checks every access rule
# (who may read, write or approve what). A red run means a rule is broken.
on:
  push:
    paths: ['supabase/**', '.github/workflows/db-tests.yml']
  pull_request:
    paths: ['supabase/**']
  workflow_dispatch:

jobs:
  rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: bash supabase/tests/run.sh
