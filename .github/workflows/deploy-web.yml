name: Deploy web app to Cloudflare Pages

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - name: Check keys are set (prints names only, never values)
        run: |
          missing=0
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_URL SUPABASE_ANON_KEY; do
            if [ -z "${!n}" ]; then echo "::error::$n is EMPTY. Secrets tab: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID. Variables tab: SUPABASE_URL, SUPABASE_ANON_KEY."; missing=1; fi
          done
          exit $missing
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Test
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Build web
        working-directory: app
        run: >
          flutter build web --release
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app/build/web --project-name=icon-extreme --branch=main
